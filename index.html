h2{font-size:19px;margin:18px 0 10px}.added{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}.daytask-wrap{position:relative;overflow:hidden;border-radius:19px}.daytask{position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:19px;padding:13px 14px;min-height:58px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.02);transform:translateX(0);transition:transform .18s ease}.daytask.swiping{transition:none}.daytask-delete{position:absolute;inset:0 0 0 auto;width:74px;background:#d95c62;color:#fff;border:0;display:grid;place-items:center;font-size:24px;z-index:1;cursor:pointer}.daytask-delete span{font-size:24px}.left{display:flex;align-items:center;gap:12px;min-width:0}.taskemoji{width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;font-size:31px;line-height:1}.name{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}.check{width:24px;height:24px;border:2px solid #d9d3d6;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:0 0 24px}.done .check{background:var(--accent);border-color:var(--accent)}.done .name{text-decoration:line-through;color:var(--muted)}

.year-month{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:12px;cursor:pointer}

.reminder-note{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--selected-bg);color:var(--accent);font-size:13px;font-weight:600}
.time-actions{display:flex;gap:10px;margin-top:18px}
.time-actions button{flex:1;height:52px;border-radius:17px;border:0;font-size:16px;font-weight:650}
.time-cancel{background:var(--card)}
.time-save{background:var(--accent);color:#fff}

.month-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.month-head div{text-align:center;color:var(--muted);font-size:12px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.mday{border:0;background:var(--card);border-radius:15px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;color:var(--text)}.mday .count{font-size:9px;color:var(--muted);margin-top:3px}.mday.empty{background:transparent}.mday.current{background:var(--accent);color:#fff}.mday.today:not(.current){outline:2px solid var(--accent)}.mday.current .count{color:rgba(255,255,255,.8)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px;text-align:left}.opt.selected{border-color:var(--accent)}.bgthumb{height:82px;border-radius:13px;margin-bottom:8px;background-size:cover;background-position:center}
.dark{--bg:#171719;--text:#f4f1f2;--card:#242426;--line:#353438}.dark .nav{background:rgba(35,35,38,.94)}
.day-screen{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}.day-screen.open{display:block}.day-head{display:flex;align-items:center;gap:12px;margin-bottom:25px}.back{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;font-size:25px;color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.06)}.day-title{font-size:26px;font-weight:700;letter-spacing:-.025em}.day-subtitle{font-size:14px;color:var(--muted);margin-top:3px}.detail-list{display:flex;flex-direction:column;gap:10px}.detail-empty{padding:55px 15px;text-align:center;color:var(--muted);font-size:16px}.detail-add{margin-top:18px;border:0;width:100%;height:54px;border-radius:18px;background:var(--accent);color:white;font-size:16px;font-weight:650}.add-sheet{background:var(--bg);width:100%;max-height:82vh;border-radius:30px 30px 0 0;padding:18px;overflow:auto}.add-sheet h3{font-size:22px;margin:4px 0 15px}


.custom-task-create{margin-top:12px;width:100%;height:52px;border:1px dashed var(--line);border-radius:17px;background:transparent;color:var(--accent);font-size:16px;font-weight:650}
.custom-form{background:var(--bg);width:100%;border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.custom-form h3{margin:3px 0 5px;font-size:23px}.custom-form .hint{margin:0 0 18px;color:var(--muted);font-size:14px}
.custom-fields{display:grid;grid-template-columns:1fr 78px;gap:10px}.custom-input{width:100%;height:54px;border:1px solid var(--line);border-radius:17px;background:var(--card);padding:0 15px;font-size:17px;color:var(--text);outline:none}.custom-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--selected-bg)}.emoji-input{text-align:center;font-size:28px;padding:0}.custom-save{margin-top:14px;width:100%;height:54px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-size:16px;font-weight:650}.custom-cancel{margin-top:9px;width:100%;height:48px;border:0;border-radius:16px;background:var(--card);color:var(--text);font-size:15px;font-weight:600}
@media(max-width:370px){.calendar-date .dow{font-size:12px}.calendar-date .num{font-size:23px}.center-pill .pill-dow{font-size:12px}.center-pill .pill-num{font-size:23px}}

/* v13: dates slide ABOVE the fixed pill */
.calendar-track{position:relative;z-index:3}
.center-pill{z-index:1}
.calendar-date .dow,.calendar-date .num{transition:color .06s linear}

.color-card{grid-column:1/-1}

.picker-hue{height:18px;border-radius:999px;margin-top:4px;background:linear-gradient(90deg,#e98d9d 0%,#edaa72 12%,#e6c86e 24%,#9fbd83 36%,#72b9a7 48%,#75aeca 60%,#8d9ed1 72%,#aa91c9 84%,#d28cae 92%,#e98d9d 100%);position:relative;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.hue-knob{position:absolute;top:50%;width:27px;height:27px;border-radius:50%;background:var(--card);border:3px solid rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(0,0,0,.22);transform:translate(-50%,-50%);pointer-events:none}

<body><div id="app"></div>
<script>
const tasks=[
["breakfast","Завтрак","🍳","Еда"],["lunch","Обед","🥗","Еда"],["dinner","Ужин","🍽️","Еда"],["cook","Готовка","🍳","Еда"],
["vacuum","Пылесос","🧹","Дом"],["strength","Силовая","🏋️","Спорт"],["cardio","Кардио","🏃","Спорт"],
["leo","Играть с Лео","🧸","Ребёнок"],["readleo","Читать Лео","📖","Ребёнок"],
["laundry","Стирка","🧺","Быт"],["dryer","Разобрать сушилку","🧦","Быт"],["bath","Ванна с кремом","🛁","Быт"],
["study","Учёба","📚","Планы"],["mom","Позвонить маме","📞","Планы"]];
let customTasks=JSON.parse(localStorage.getItem("ritmCustomTasks")||"[]").map(t=>[t[0],t[1],t[2],t[3]||"Планы"]);
function allTasks(){return tasks.concat(customTasks)}
const taskCategories=["Еда","Дом","Ребёнок","Хобби","Спорт","Быт","Планы"];
function categoryTasks(){
 const groups={}; taskCategories.forEach(c=>groups[c]=[]);
 allTasks().forEach(t=>{const c=t[3]&&taskCategories.includes(t[3])?t[3]:"Планы";groups[c].push(t)});
 return groups;
}
function saveCustomTasks(){localStorage.setItem("ritmCustomTasks",JSON.stringify(customTasks))}
const photos={
mist:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88",
forest:"https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1400&q=88",
sea:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=88",
night:"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=88"};
const todayKey=key(new Date());
let old=JSON.parse(localStorage.getItem("ritm9")||localStorage.getItem("ritm8")||localStorage.getItem("ritm7")||localStorage.getItem("ritm6")||"null");
let state=old?{date:old.date||todayKey,plans:old.plans||{},accent:old.accent||"green",theme:old.theme||"day",bg:old.bg||"mist",solidColor:old.solidColor||"#d9d3d6",dayOpen:false}:{date:todayKey,plans:{},accent:"green",theme:"day",bg:"mist",solidColor:"#d9d3d6",dayOpen:false};
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateFrom(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function pad(n){return String(n).padStart(2,"0")}
function fmt(s){return dateFrom(s).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}
function save(){localStorage.setItem("ritm10",JSON.stringify(state))}
function swipeSound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=900;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.035,c.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.07);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function plural(n,a,b,c){let x=n%10,y=n%100;return x===1&&y!==11?a:x>=2&&x<=4&&(y<10||y>=20)?b:c}
function render(){
applyAppearance();

function taskIcon(id){const t=allTasks().find(t=>t[0]===id);return t?t[2]:"📝"}
function taskById(id){return allTasks().find(t=>t[0]===id)}
function centerDates(){
const cal=document.getElementById("calendar"),track=document.getElementById("track");
if(!track)return;
const w=cal.clientWidth/7;
track.style.transition="none";
track.style.transform=`translate3d(${cal.clientWidth/2-w/2-(15*w)}px,0,0)`;
highlightCenter(15);
}
function highlightCenter(index){
const track=document.getElementById("track");
if(!track)return;
[...track.children].forEach((el,i)=>el.classList.toggle("under-pill",i===index));
}
function refreshTaskUI(){
const planned=state.plans[state.date]||[],done=planned.filter(x=>x.done).length,pct=planned.length?Math.round(done/planned.length*100):0;
const today=document.querySelector(".today-title"),pctEl=document.querySelector(".pct"),sub=document.querySelector(".sub"),bar=document.querySelector(".bar>i"),summary=document.querySelector(".day-summary");
if(today)today.textContent=`Сегодня ${planned.length} ${plural(planned.length,"задача","задачи","задач")}`;
if(pctEl)pctEl.textContent=`${pct}%`;
if(sub)sub.textContent=`${done} из ${planned.length} выполнено`;
if(bar)bar.style.width=`${pct}%`;
if(summary){const c=summary.querySelector(".count");if(c)c.textContent=planned.length?planned.length:"нет";summary.classList.toggle("open",!!state.dayOpen)}

function syncSelectedTiles(){
const selected=new Set((state.plans[state.date]||[]).map(x=>x.id));
document.querySelectorAll(".tasklib .tile").forEach(tile=>{
const m=tile.getAttribute("onclick")?.match(/addTask\('([^']+)'\)/), id=m&&m[1];
if(!id)return;
const on=selected.has(id);
tile.classList.toggle("selected",on);
let check=tile.querySelector(".plus");
if(on&&!check){check=document.createElement("span");check.className="plus";check.textContent="✓";tile.appendChild(check)}
if(!on&&check)check.remove();
});
}

function syncAddedList(){
const box=document.querySelector(".added");if(!box)return;
const planned=state.plans[state.date]||[];
if(!planned.length){box.innerHTML=`<div class="empty">Добавь дела ниже — они появятся здесь.</div>`;return}
if(!state.dayOpen){box.classList.add("collapsed");return}
box.classList.remove("collapsed");
box.innerHTML=planned.map((p,i)=>dayTaskMarkup(p,i)).join("");
attachDayTaskSwipe(box);
}


function dayTaskMarkup(p,i){
return `<div class="daytask-wrap" data-index="${i}">
<button class="daytask-delete" type="button" aria-label="Убрать из сегодняшних дел" onclick="event.stopPropagation();removeFromToday(${i})"><span>🗑️</span></button>
<div class="daytask ${p.done?"done":""}" onclick="toggle(${i})">
<div class="left"><span class="taskemoji">${taskIcon(p.id)}</span><span class="name">${p.name}</span></div>
<div class="time-row">${p.time?`<span class="time-btn set">${p.time}</span>`:""}<span class="check">${p.done?"✓":""}</span></div>
</div></div>`;
}
function removeFromToday(i){
const a=state.plans[state.date]||[];
if(!a[i])return;
a.splice(i,1);
state.plans[state.date]=a;
save();
refreshTaskUI();
syncSelectedTiles();
syncAddedList();
}
function attachDayTaskSwipe(box){
if(!box)return;
box.querySelectorAll(".daytask-wrap").forEach(wrap=>{
const row=wrap.querySelector(".daytask");
if(!row)return;
let sx=0,sy=0,dx=0,drag=false,vertical=false;
const start=e=>{
const t=e.touches?e.touches[0]:e;
sx=t.clientX;sy=t.clientY;dx=0;drag=true;vertical=false;
row.classList.add("swiping");
};
const move=e=>{
if(!drag)return;
const t=e.touches?e.touches[0]:e;
dx=t.clientX-sx; const dy=t.clientY-sy;
if(Math.abs(dy)>Math.abs(dx)+6){vertical=true;return;}
if(dx>0)dx=0;
if(dx<-82)dx=-82;
row.style.transform=`translateX(${dx}px)`;
if(e.cancelable)e.preventDefault();
};
const end=()=>{
if(!drag)return;
drag=false;row.classList.remove("swiping");
if(vertical){row.style.transform="translateX(0)";return;}
row.style.transform=dx<-38?"translateX(-74px)":"translateX(0)";
};
row.addEventListener("touchstart",start,{passive:true});
row.addEventListener("touchmove",move,{passive:false});
row.addEventListener("touchend",end,{passive:true});
row.addEventListener("touchcancel",end,{passive:true});
});
}

function addTask(id){
let a=state.plans[state.date]||[], existing=a.findIndex(x=>x.id===id);
if(existing!==-1)a.splice(existing,1);
else{let t=taskById(id);if(!t)return;a.push({id,name:t[1],done:false,time:"",reminder:false})}
state.plans[state.date]=a;save();
refreshTaskUI();syncSelectedTiles();
if(state.dayOpen)syncAddedList();
}

function toggleDayOpen(){state.dayOpen=!state.dayOpen;const box=document.querySelector(".added");if(box)box.classList.toggle("collapsed",!state.dayOpen);const summary=document.querySelector(".day-summary");if(summary)summary.classList.toggle("open",state.dayOpen);if(state.dayOpen)syncAddedList()}

function shift(n){
let d=dateFrom(state.date);d.setDate(d.getDate()+n);state.date=key(d);save();swipeSound();updateDayHeaderOnly();refreshCalendarOnly();
}
function attachSwipe(){
const cal=document.getElementById("calendar"),track=document.getElementById("track");
if(!cal||!track)return;
let sx=0,sy=0,dx=0,drag=false,startIndex=15;
function metrics(){return {w:cal.clientWidth/7,base:cal.clientWidth/2-(cal.clientWidth/7)/2-15*(cal.clientWidth/7)}}
function updateDrag(){
const {w,base}=metrics();
track.style.transform=`translate3d(${base+dx}px,0,0)`;
let idx=Math.max(0,Math.min(track.children.length-1,15-Math.round(dx/w)));
highlightCenter(idx);
}
cal.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;window.__ritmSwipeDx=0;drag=true;startIndex=15;
cal.classList.add("dragging");track.style.transition="none";
},{passive:true});
cal.addEventListener("touchmove",e=>{
if(!drag)return;
dx=e.touches[0].clientX-sx;window.__ritmSwipeDx=dx;let dy=e.touches[0].clientY-sy;
if(Math.abs(dx)>Math.abs(dy)){e.preventDefault();updateDrag()}
},{passive:false});
cal.addEventListener("touchend",()=>{
if(!drag)return;drag=false;window.__ritmSwipeDx=dx;cal.classList.remove("dragging");
const {w,base}=metrics();
let n=dx<-w*.32?1:dx>w*.32?-1:0;
if(!n){track.style.transition="transform .18s ease-out";track.style.transform=`translate3d(${base}px,0,0)`;highlightCenter(15);return}
track.style.transition="transform .22s cubic-bezier(.2,.78,.25,1)";
track.style.transform=`translate3d(${base-n*w}px,0,0)`;
const nextIndex=15+n;
highlightCenter(nextIndex);
setTimeout(()=>{
/* Commit in-place: recycle one date node instead of rebuilding the calendar.
   This keeps the page painted continuously and prevents the one-frame white flash. */
const current=document.getElementById("track");
if(!current)return;
let selected=dateFrom(state.date);
selected.setDate(selected.getDate()+n);
state.date=key(selected);
save();
swipeSound();
updateDayHeaderOnly();

if(n===1){
  const first=current.firstElementChild;
  if(first) current.removeChild(first);
  const lastDate=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()+16);
  current.insertAdjacentHTML("beforeend",`<div class="calendar-date" data-date="${key(lastDate)}"><span class="dow">${lastDate.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span><span class="num">${lastDate.getDate()}</span></div>`);
}else{
  const last=current.lastElementChild;
  if(last) current.removeChild(last);
  const firstDate=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate()-16);
  current.insertAdjacentHTML("afterbegin",`<div class="calendar-date" data-date="${key(firstDate)}"><span class="dow">${firstDate.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span><span class="num">${firstDate.getDate()}</span></div>`);
}
current.style.transition="none";
const m=metrics();
current.style.transform=`translate3d(${m.base}px,0,0)`;
highlightCenter(15);
attachCalendarClicksOnly();
},225);
},{passive:true});
window.__ritmSwipeDx=0;
cal.querySelectorAll(".calendar-date").forEach(el=>el.addEventListener("click",()=>{
if(Math.abs(window.__ritmSwipeDx)<8){state.date=el.dataset.date;save();render()}
}));
}
function month(){
let d=dateFrom(state.date),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,cells="";
for(let i=0;i<lead;i++)cells+=`<div class="mday empty"></div>`;
for(let n=1;n<=days;n++){let s=`${y}-${pad(m+1)}-${pad(n)}`,a=state.plans[s]||[];cells+=`<button class="mday ${s===state.date?"current":""} ${s===todayKey?"today":""}" onclick="openDay('${s}')">${n}<span class="count">${a.length?a.length+" дел.":""}</span></button>`}
const modal=document.getElementById("modal");
modal.innerHTML=`<div class="sheet month-sheet" id="monthSheet"><div class="sheet-handle" id="sheetHandle"></div><div class="month-sheet-head"><button class="sheet-back" onclick="yearView()">‹</button><h3>${d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})}</h3><button class="close" onclick="closeM()">×</button></div><div class="month-sheet-body" id="monthSheetBody"><div class="month-head"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><div class="month-grid">${cells}</div><div class="year-reveal"><div class="year-reveal-title">${y}</div>${buildYearGrid(y)}</div></div></div>`;
modal.style.display="flex";attachMonthSheetGesture();
}
function buildYearGrid(y){
let months="";
for(let m=0;m<12;m++){
 const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7;
 let cells=""; for(let i=0;i<lead;i++)cells+=`<span class="mini-day"></span>`;
 for(let n=1;n<=days;n++){const s=`${y}-${pad(m+1)}-${pad(n)}`,a=state.plans[s]||[];cells+=`<span class="mini-day ${s===todayKey?"today":""} ${a.length?"has":""}">${n}</span>`}
 months+=`<button class="year-month" onclick="state.date='${y}-${pad(m+1)}-01';save();month()"><div class="year-month-title">${first.toLocaleDateString("ru-RU",{month:"long"})}</div><div class="mini-head"><span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span></div><div class="mini-grid">${cells}</div></button>`;
}
return `<div class="year-grid">${months}</div>`;
}
function yearView(){
const d=dateFrom(state.date),y=d.getFullYear();
const modal=document.getElementById("modal");
modal.innerHTML=`<div class="sheet month-sheet expanded" id="monthSheet"><div class="sheet-handle"></div><div class="month-sheet-head"><button class="sheet-back" onclick="month()">‹</button><h3>${y}</h3><button class="close" onclick="closeM()">×</button></div><div class="month-sheet-body">${buildYearGrid(y)}</div></div>`;
modal.style.display="flex";
attachMonthSheetGesture();

function attachMonthSheetGesture(){
const sheet=document.getElementById("monthSheet"),body=document.getElementById("monthSheetBody")||sheet?.querySelector(".month-sheet-body");if(!sheet||!body)return;
let sy=0,dy=0,drag=false,startExpanded=sheet.classList.contains("expanded");
const start=e=>{const t=e.touches?e.touches[0]:e;if(!e.target.closest(".sheet-handle,.month-sheet-head"))return;sy=t.clientY;dy=0;drag=true;startExpanded=sheet.classList.contains("expanded");sheet.style.transition="none"};
const move=e=>{if(!drag)return;const t=e.touches?e.touches[0]:e;dy=t.clientY-sy;e.preventDefault();const base=startExpanded?92:68;const vh=window.innerHeight;const h=Math.max(60,Math.min(94,base-dy/vh*100));sheet.style.maxHeight=h+"vh";const progress=startExpanded?Math.max(0,Math.min(1,dy/vh*2)):Math.max(0,Math.min(1,-dy/vh*2));if(!startExpanded)body.scrollTop=progress*body.scrollHeight*.72;else body.scrollTop=(1-progress)*body.scrollHeight*.72;};
const end=()=>{if(!drag)return;drag=false;sheet.style.transition="max-height .28s cubic-bezier(.2,.8,.2,1)";if(dy<-55){sheet.classList.add("expanded");sheet.style.maxHeight="92vh";setTimeout(()=>body.scrollTo({top:body.scrollHeight*.72,behavior:"smooth"}),30)}else if(dy>55){sheet.classList.remove("expanded");sheet.style.maxHeight="68vh";body.scrollTo({top:0,behavior:"smooth"})}else{sheet.style.maxHeight=startExpanded?"92vh":"68vh"}};
sheet.addEventListener("touchstart",start,{passive:true});sheet.addEventListener("touchmove",move,{passive:false});sheet.addEventListener("touchend",end,{passive:true});
}
function pick(s){state.date=s;save();closeM();render()}function openTodayStats(){
 const s=state.date,d=dateFrom(s),a=state.plans[s]||[],total=a.length,done=a.filter(x=>x.done).length;
 const cats=taskCategories.map((cat,i)=>({cat,all:a.filter(x=>{const t=taskById(x.id);return t&&t[3]===cat}),color:["#5b9d8d","#6f9fd6","#c79a61","#a58ac2","#6e88b8","#b58a72","#8b9299"][i]})).filter(x=>x.all.length);
 const completed=cats.reduce((n,c)=>n+c.all.filter(x=>x.done).length,0);
 let start=0,parts=[];
 cats.forEach(c=>{const n=c.all.filter(x=>x.done).length;if(n){const end=start+(n/Math.max(completed,1))*100;parts.push(`${c.color} ${start}% ${end}%`);start=end;}});
 const gradient=parts.length?`conic-gradient(${parts.join(",")})`:"conic-gradient(#e8e4e6 0 100%)";
 const pct=total?Math.round(done/total*100):0;
 const modal=document.createElement("div");modal.className="stats-screen";modal.id="statsScreen";
 modal.innerHTML=`<div class="stats-head"><button class="stats-back" type="button" onclick="document.getElementById('statsScreen')?.remove()">‹</button><div><h1 class="stats-title">Сегодня</h1><div class="stats-date">${d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}</div></div></div>
 <div class="stats-hero"><div class="stats-percent">${pct}%</div><div class="stats-label">${done} из ${total} выполнено</div>
 <div class="donut-wrap"><div class="donut" style="background:${gradient}"><div class="donut-center"><strong>${done}</strong><span>выполнено</span></div></div></div>
 <div class="stats-list">${cats.length?cats.map(c=>{const n=c.all.length,dc=c.all.filter(x=>x.done).length,cp=n?Math.round(dc/n*100):0;return `<div class="stats-row"><span class="stats-dot" style="background:${c.color}"></span><div><div class="stats-cat">${c.cat}</div><div class="stats-detail">${dc} из ${n} дел · ${cp}% категории</div></div><div class="stats-value">${total?Math.round(n/total*100):0}%</div></div>`}).join(""):`<div class="stats-empty">На этот день пока нет дел.</div>`}</div></div>
 <div class="stats-task-list"><h3>Мои дела</h3>${a.length?a.map(x=>`<div class="stats-task"><span>${taskIcon(x.id)}</span><span>${x.name}</span><span class="done-mark">${x.done?"✓":""}</span></div>`).join(""):"<div class='stats-empty'>Добавь первое дело на сегодня.</div>"}</div>`;
 document.body.appendChild(modal);
}

function formatTime(t){return t||"Время"}
function openTimePicker(index){

function saveTaskTime(index){
 const input=document.getElementById("taskTimeInput"),a=state.plans[state.date]||[]; if(!a[index]||!input)return;
 a[index].time=input.value||"";a[index].reminder=true;state.plans[state.date]=a;save();document.getElementById("timeModal")?.remove();renderDayInPlace();
 if(input.value) requestNotificationPermission().then(()=>scheduleOpenReminder(a[index]));

function clearTaskTime(index){const a=state.plans[state.date]||[];if(a[index]){a[index].time="";a[index].reminder=false;state.plans[state.date]=a;save()}document.getElementById("timeModal")?.remove();renderDayInPlace()}
async function requestNotificationPermission(){try{if("Notification" in window && Notification.permission==="default")await Notification.requestPermission()}catch(e){}}
function scheduleOpenReminder(p){
 if(!p.time||p.reminder===false)return; const [hh,mm]=p.time.split(":").map(Number); const d=dateFrom(state.date); d.setHours(hh,mm,0,0); const delay=d.getTime()-Date.now()-3600000; if(delay>0&&delay<2147483647){setTimeout(()=>{if("Notification" in window&&Notification.permission==="granted")new Notification(`Через час: ${p.name}`,{body:`Запланировано на ${p.time}`})},delay)}
}
function rescheduleOpenReminders(){(state.plans[state.date]||[]).forEach(scheduleOpenReminder)}
function renderDayInPlace(){
 const screen=document.getElementById("dayScreen");
 if(!screen)return;
 const s=state.date,d=dateFrom(s),a=state.plans[s]||[];
 const head=screen.querySelector(".day-subtitle");
 if(head)head.textContent=a.length?a.length+" "+plural(a.length,"дело","дела","дел"):"Сегодня пока нет дел";
 const oldList=screen.querySelector(".detail-list");
 if(!oldList)return;
 oldList.innerHTML=a.length?a.map((p,i)=>`<div class="detail-task ${p.done?"done":""}" onclick="detailToggle(${i})"><div class="left"><span class="taskemoji">${taskIcon(p.id)}</span><span class="name">${p.name}</span></div><div class="time-row"><button type="button" class="time-btn ${p.time?"set":""}" onclick="event.stopPropagation();openTimePicker(${i})">${formatTime(p.time)}</button><span class="check">${p.done?"✓":""}</span></div></div>`).join(""):`<div class="detail-empty">Здесь пока пусто.<br>Добавь дела на этот день.</div>`;
}
function openDay(s,keepAdd=false){
state.date=s;save();closeM();document.getElementById("dayScreen")?.remove();
const d=dateFrom(s),a=state.plans[s]||[];
document.body.insertAdjacentHTML("beforeend",`<div class="day-screen open" id="dayScreen"><div class="day-head"><button class="back" onclick="closeDay()">‹</button><div><div class="day-title">${d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</div><div class="day-subtitle">${a.length?a.length+" "+plural(a.length,"дело","дела","дел"):"Сегодня пока нет дел"}</div></div></div><div class="detail-list">${a.length?a.map((p,i)=>`<div class="detail-task ${p.done?"done":""}" onclick="detailToggle(${i})"><div class="left"><span class="taskemoji">${taskIcon(p.id)}</span><span class="name">${p.name}</span></div><div class="time-row"><button class="time-btn ${p.time?"set":""}" onclick="event.stopPropagation();openTimePicker(${i})">${formatTime(p.time)}</button><span class="check">${p.done?"✓":""}</span></div></div>`).join(""):`<div class="detail-empty">Здесь пока пусто.<br>Добавь дела на этот день.</div>`}</div><button class="detail-add" onclick="openAddSheet()">＋ Добавить дело</button></div>`);
if(keepAdd)openAddSheet();
}
function closeDay(){document.getElementById("dayScreen")?.remove();render()}
function detailToggle(i){const a=state.plans[state.date]||[];if(!a[i])return;a[i].done=!a[i].done;save();const screen=document.getElementById("dayScreen");if(screen){const row=screen.querySelectorAll(".detail-task")[i];if(row){row.classList.toggle("done",a[i].done);const c=row.querySelector(".check");if(c)c.textContent=a[i].done?"✓":""}}}
function renderTaskButtons(chosen, handler){
 return Object.entries(categoryTasks()).filter(([cat,items])=>items.length).map(([cat,items])=>`<section class="task-category"><h3 class="task-category-title"><span class="dot"></span>${cat}</h3>${items.map(t=>`<button class="tile ${chosen.has(t[0])?"selected":""}" onclick="${handler}('${t[0]}')"><span class="tileemoji">${t[2]}</span><span class="name">${t[1]}</span>${chosen.has(t[0])?'<span class="plus">✓</span>':''}</button>`).join("")}</section>`).join("");
}
function openAddSheet(){
const chosen=new Set((state.plans[state.date]||[]).map(x=>x.id));
const modal=document.createElement("div");modal.className="modal";modal.style.display="flex";modal.id="addModal";
modal.innerHTML=`<div class="add-sheet"><button class="close" onclick="document.getElementById('addModal')?.remove()">×</button><h3>Добавить дело</h3>${renderTaskButtons(chosen,"addFromDetail")}<button class="custom-task-create" type="button" onclick="openCustomTaskForm(true)">＋ Новое дело</button></div>`;
document.body.appendChild(modal);
}
function openCustomTaskForm(fromDay=false){
const modal=document.createElement("div");modal.className="modal";modal.style.display="flex";modal.id="customTaskModal";
modal.innerHTML=`<div class="custom-form"><button class="close" onclick="document.getElementById('customTaskModal')?.remove()">×</button><h3>Новое дело</h3><p class="hint">Придумай название, смайлик и категорию — оно сохранится в твоей базе.</p><div class="custom-fields"><input id="customTaskName" class="custom-input" maxlength="40" placeholder="Например, Акробатика Лео" autocomplete="off"><input id="customTaskEmoji" class="custom-input emoji-input" maxlength="4" value="📝" aria-label="Смайлик"></div><select id="customTaskCategory" class="category-select" aria-label="Категория"><option>Еда</option><option>Дом</option><option>Ребёнок</option><option>Хобби</option><option>Спорт</option><option>Быт</option><option selected>Планы</option></select><button class="custom-save" type="button" onclick="saveCustomTask(${fromDay?'true':'false'})">Добавить дело</button><button class="custom-cancel" type="button" onclick="document.getElementById('customTaskModal')?.remove()">Отмена</button></div>`;
document.body.appendChild(modal);setTimeout(()=>document.getElementById('customTaskName')?.focus(),50);
}
function saveCustomTask(fromDay=false){
const name=(document.getElementById('customTaskName')?.value||'').trim();
let emoji=(document.getElementById('customTaskEmoji')?.value||'📝').trim();
const category=document.getElementById('customTaskCategory')?.value||"Планы";
if(!name)return;
if(!emoji)emoji='📝';
const id='custom_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);

// Новое дело создаётся только в постоянной библиотеке.
// В сегодняшний день оно не добавляется автоматически.
customTasks.push([id,name,emoji,category]);
saveCustomTasks();

document.getElementById('customTaskModal')?.remove();

if(fromDay){
  // Оставляем пользователя в режиме выбора дел дня.
  // Новое дело уже появилось в нужной категории, но ждёт отдельного нажатия.
  document.getElementById('addModal')?.remove();
  openAddSheet();
}else{
  refreshTaskUI();
  syncSelectedTiles();
  syncAddedList();
}
}

function addFromDetail(id){
let a=state.plans[state.date]||[],idx=a.findIndex(x=>x.id===id);
if(idx!==-1)a.splice(idx,1);
else{let t=taskById(id);if(!t)return;a.push({id,name:t[1],done:false,time:"",reminder:false})}
state.plans[state.date]=a;save();

const modal=document.getElementById("addModal");
if(modal){
 const chosen=new Set(a.map(x=>x.id));
 modal.querySelectorAll(".tile").forEach(tile=>{
   const m=tile.getAttribute("onclick")?.match(/addFromDetail\('([^']+)'\)/),tid=m&&m[1];
   if(!tid)return;
   const on=chosen.has(tid);
   tile.classList.toggle("selected",on);
   let c=tile.querySelector(".plus");
   if(on&&!c){c=document.createElement("span");c.className="plus";c.textContent="✓";tile.appendChild(c)}
   if(!on&&c)c.remove();
 });
}
renderDayInPlace();
}
function applyAppearance(){
document.documentElement.style.setProperty("--accent",state.accent==="pink"?"var(--pink)":"var(--green)");
document.documentElement.style.setProperty("--selected-bg",state.accent==="pink"?"rgba(228,155,181,.12)":"rgba(47,118,104,.12)");
document.documentElement.style.setProperty("--selected-shadow",state.accent==="pink"?"rgba(228,155,181,.18)":"rgba(47,118,104,.18)");
document.body.className=state.theme==="night"?"dark":"";
const progress=document.querySelector(".progress");
if(progress){
 if(state.bg==="color"){
   progress.style.backgroundImage="none";
   progress.style.backgroundColor=state.solidColor;
 }else{
   progress.style.backgroundColor="";
   progress.style.backgroundImage=`url('${photos[state.bg]}')`;
 }
}
}
function updateSettingsPreview(){
const selectedBg=document.querySelectorAll(".sheet .opt");
selectedBg.forEach(el=>el.classList.remove("selected"));
}
function settings(){
const hue=getHueFromHex(state.solidColor||"#d9d3d6");
const palette=["#e98d9d","#eaa77a","#e4c56f","#a5bb80","#71b7a3","#74a9c6","#8f9ed0","#aa91c8","#c98cab","#8e6f83","#6f8792","#d38f76"];
document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeM()">×</button><h3>Настройки</h3>
<p>Акцент</p><div class="opts"><button class="opt ${state.accent==="green"?"selected":""}" onclick="setAccent('green')">Изумрудный</button><button class="opt ${state.accent==="pink"?"selected":""}" onclick="setAccent('pink')">Розовый</button></div>
<p>Тема</p><div class="opts"><button class="opt ${state.theme==="day"?"selected":""}" onclick="setTheme('day')">День</button><button class="opt ${state.theme==="night"?"selected":""}" onclick="setTheme('night')">Ночь</button></div>
<p>Фон карточки</p><div class="opts">
${Object.entries(photos).map(([k,v])=>`<button class="opt ${state.bg===k?"selected":""}" onclick="setBg('${k}')"><div class="bgthumb" style="background-image:url('${v}')"></div>${{mist:"Туманное утро",forest:"Тихий лес",sea:"Спокойное море",night:"Ночное небо"}[k]}</button>`).join("")}
<button class="opt color-card ${state.bg==="color"?"selected":""}" onclick="setBg('color')"><div class="color-preview" style="background:${state.solidColor}"><span>Любой цвет</span></div>Однотонный фон</button>
</div>
<div class="color-panel">
<p>Цвет</p>
<div class="color-swatches">${palette.map(c=>`<button class="color-swatch ${state.solidColor.toLowerCase()===c?"selected":""}" style="background:${c}" aria-label="Выбрать цвет" onclick="setSolidColor('${c}')"></button>`).join("")}</div>
<div class="picker-hue" id="huePicker"><div class="hue-knob" id="hueKnob"></div></div>
<div class="color-hint">Проведи пальцем по палитре, чтобы выбрать оттенок</div>
</div>
</div>`;
document.getElementById("modal").style.display="flex";
positionHue(hue);attachHuePicker();
}
function getHueFromHex(hex){return hexToHsv(hex).h}
function hexToHsv(hex){
hex=hex.replace("#","");let r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
let max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);if(h<0)h+=360}return {h,s:max?d/max:0,v:max}}
function hsvToHex(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return "#"+[r,g,b].map(q=>Math.round((q+m)*255).toString(16).padStart(2,"0")).join("")}
function positionHue(h){const hk=document.getElementById("hueKnob");if(hk)hk.style.left=`${h/360*100}%`}
function updateSettingsUI(){
const modal=document.getElementById("modal");if(!modal)return;
modal.querySelectorAll(".opts .opt").forEach(b=>b.classList.remove("selected"));
modal.querySelectorAll(".opts .opt").forEach(b=>{const a=b.getAttribute("onclick")||"";if((state.accent==="green"&&a.includes("setAccent('green'"))||(state.accent==="pink"&&a.includes("setAccent('pink'"))||(state.theme==="day"&&a.includes("setTheme('day'"))||(state.theme==="night"&&a.includes("setTheme('night'"))||(state.bg!=="color"&&a.includes(`setBg('${state.bg}'`))||(state.bg==="color"&&a.includes("setBg('color'")))b.classList.add("selected")});
const prev=modal.querySelector(".color-preview");if(prev)prev.style.background=state.solidColor;
modal.querySelectorAll(".color-swatch").forEach(b=>b.classList.toggle("selected",b.style.backgroundColor===state.solidColor||b.style.background===state.solidColor));
positionHue(getHueFromHex(state.solidColor||"#d9d3d6"));
}
function setSolidColor(c){state.solidColor=c;state.bg="color";save();applyAppearance();updateSettingsUI()}
function attachHuePicker(){
const hu=document.getElementById("huePicker");if(!hu)return;let down=false;
function point(e){const r=hu.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
function apply(x){
const h=x*360;const c=hsvToHex(h,.42,.91);state.solidColor=c;state.bg="color";save();
const hk=document.getElementById("hueKnob");if(hk)hk.style.left=`${x*100}%`;
const prev=document.querySelector(".color-preview");if(prev)prev.style.background=c;
const progress=document.querySelector(".progress");if(progress){progress.style.backgroundImage="none";progress.style.backgroundColor=c}
}
hu.addEventListener("pointerdown",e=>{down=true;hu.setPointerCapture(e.pointerId);apply(point(e))});
hu.addEventListener("pointermove",e=>{if(down)apply(point(e))});
hu.addEventListener("pointerup",()=>{down=false;updateSettingsUI()});
hu.addEventListener("pointercancel",()=>{down=false;updateSettingsUI()});
}
function setAccent(x){state.accent=x;save();applyAppearance();updateSettingsUI();syncSelectedTiles()}
function setTheme(x){state.theme=x;save();applyAppearance();updateSettingsUI()}
function setBg(x){state.bg=x;save();applyAppearance();updateSettingsUI()}
applyAppearance();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=20");
</script>
</body></html>
