<script>
// v51: one deterministic persistent navigation handler.
(function(){
  const nav=document.getElementById("globalNav");
  function closeTransient(){
    document.getElementById("periodScreen")?.remove();
    document.getElementById("dayScreen")?.remove();
    const modal=document.getElementById("modal");
    if(modal){modal.style.display="none";modal.innerHTML="";}
  }
  function go(route){
    closeTransient();
    if(route==="day") render();
    else if(route==="month") month();
    else if(route==="stats") openPeriodStats();
    else if(route==="settings") settings();
    requestAnimationFrame(updateGlobalNav);
  }
  function updateGlobalNav(){
    const period=!!document.getElementById("periodScreen");
    const day=!!document.getElementById("dayScreen");
    const modal=document.getElementById("modal");
    const settingsOpen=!!(modal && modal.style.display!=="none" && modal.querySelector(".settings-nav"));
    const monthOpen=!!(modal && modal.style.display!=="none" && modal.querySelector(".month-sheet"));
    const active=period?"stats":settingsOpen?"settings":monthOpen?"month":day?"day":"day";
    nav?.querySelectorAll("button[data-route]").forEach(b=>b.classList.toggle("sel",b.dataset.route===active));
  }
  window.updateGlobalNav=updateGlobalNav;
  nav?.addEventListener("click",e=>{
    const b=e.target.closest("button[data-route]");
    if(!b)return;
    e.preventDefault();
    e.stopPropagation();
    go(b.dataset.route);
  });
  window.addEventListener("load",updateGlobalNav);
})();

// v40: библиотека дел полностью очищена от встроенных примеров.
// Все дела теперь создаёт пользователь сам; категории появляются только когда в них есть дела.
const tasks=[];
let customTasks=JSON.parse(localStorage.getItem("ritmCustomTasks")||"[]").map(t=>[t[0],t[1],t[2],t[3]||""]);
let deletedTaskIds=JSON.parse(localStorage.getItem("ritmDeletedTasks")||"[]");
let taskCategories=JSON.parse(localStorage.getItem("ritmCategories")||"[]");
if(!Array.isArray(taskCategories))taskCategories=[];
customTasks.forEach(t=>{if(t[3]&&!taskCategories.includes(t[3]))taskCategories.push(t[3])});
function allTasks(){return customTasks.filter(t=>!deletedTaskIds.includes(t[0]))}
function categoryTasks(){
 const groups={}; taskCategories.forEach(c=>groups[c]=[]);
 allTasks().forEach(t=>{const c=t[3]&&taskCategories.includes(t[3])?t[3]:""; if(c){groups[c].push(t)}});
 return groups;
}
function saveCustomTasks(){persistData()}
function saveDeletedTasks(){persistData()}
function saveCategories(){localStorage.setItem("ritmCategories",JSON.stringify(taskCategories));persistData()}
const photos={
mist:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88",
forest:"https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1400&q=88",
sea:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=88",
night:"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1400&q=88"};
const todayKey=key(new Date());
let stored42=null,stored40=null,stored39=null;
try{stored42=JSON.parse(localStorage.getItem("ritmDataV42")||"null")}catch(e){}
try{stored40=JSON.parse(localStorage.getItem("ritmDataV40")||"null")}catch(e){}
try{stored39=JSON.parse(localStorage.getItem("ritmDataV39")||"null")}catch(e){}
const stored=stored42||stored40||stored39;
let old=stored?.state||JSON.parse(localStorage.getItem("ritm10")||localStorage.getItem("ritm9")||localStorage.getItem("ritm8")||localStorage.getItem("ritm7")||localStorage.getItem("ritm6")||"null");
if(stored?.customTasks&&Array.isArray(stored.customTasks))customTasks=stored.customTasks;
if(stored?.deletedTaskIds&&Array.isArray(stored.deletedTaskIds))deletedTaskIds=stored.deletedTaskIds;
if(stored?.categories&&Array.isArray(stored.categories))taskCategories=stored.categories;
let state=old?{date:old.date||todayKey,plans:old.plans||{},accent:old.accent||"green",theme:old.theme||"day",bg:old.bg||"mist",solidColor:old.solidColor||"#d9d3d6",dayOpen:false}:{date:todayKey,plans:{},accent:"green",theme:"day",bg:"mist",solidColor:"#d9d3d6",dayOpen:false};
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateFrom(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function pad(n){return String(n).padStart(2,"0")}
function fmt(s){return dateFrom(s).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}
function snapshotData(){return {version:43,savedAt:new Date().toISOString(),state:{date:state.date,plans:state.plans,accent:state.accent,theme:state.theme,bg:state.bg,solidColor:state.solidColor,dayOpen:false},customTasks,deletedTaskIds,categories:taskCategories}}
function persistData(){
 try{
   const current=localStorage.getItem("ritmDataV42");
   if(current)localStorage.setItem("ritmBackupV42",current);
   const snap=snapshotData(),json=JSON.stringify(snap);
   localStorage.setItem("ritmDataV42",json);
   localStorage.setItem("ritm10",JSON.stringify(state));
   localStorage.setItem("ritmCustomTasks",JSON.stringify(customTasks));
   localStorage.setItem("ritmDeletedTasks",JSON.stringify(deletedTaskIds));
   localStorage.setItem("ritmCategories",JSON.stringify(taskCategories));

function attachLibraryTaskSwipe(box){
 if(!box)return;
 box.querySelectorAll('.library-task-wrap').forEach(wrap=>{
   const row=wrap.querySelector('.tile');
   const trash=wrap.querySelector('.library-task-delete');
   if(!row||!trash)return;

   let sx=0,sy=0,dx=0,tracking=false,horizontal=false,moved=false,pointerId=null;

   const reset=()=>{
     row.style.transition='transform .2s ease';
     row.style.transform='translate3d(0,0,0)';
     row.classList.remove('swiping');
     wrap.dataset.open='0';
     dx=0; tracking=false; horizontal=false; moved=false; pointerId=null;
   };

   const closeOthers=()=>{
     box.querySelectorAll('.library-task-wrap').forEach(other=>{
       if(other!==wrap){
         const r=other.querySelector('.tile');
         if(r) r.style.transform='translate3d(0,0,0)';
         other.dataset.open='0';
       }
     });
   };

   const start=(e)=>{
     if(e.target.closest && e.target.closest('.library-task-delete')) return;
     closeOthers();
     sx=e.clientX; sy=e.clientY; dx=0;
     tracking=true; horizontal=false; moved=false; pointerId=e.pointerId;
     row.style.transition='none';
     row.classList.add('swiping');
     try{wrap.setPointerCapture(e.pointerId)}catch(_){}
   };

   const move=(e)=>{
     if(!tracking || e.pointerId!==pointerId)return;
     const mx=e.clientX-sx, my=e.clientY-sy;

     if(!horizontal){
       if(Math.abs(my)>Math.abs(mx)+8){
         tracking=false;
         row.style.transition='transform .18s ease';
         row.style.transform='translate3d(0,0,0)';
         row.classList.remove('swiping');
         return;
       }
       if(Math.abs(mx)>10) horizontal=true;
     }

     if(!horizontal)return;

     if(e.cancelable)e.preventDefault();
     moved=true;
     dx=Math.max(-96,Math.min(0,mx));
     row.style.transform=`translate3d(${dx}px,0,0)`;
   };

   const end=(e)=>{
     if(e.pointerId!==pointerId)return;
     if(!tracking && !moved){ reset(); return; }

     tracking=false;
     row.classList.remove('swiping');

     if(horizontal && dx<-48){
       row.style.transition='transform .18s ease';
       row.style.transform='translate3d(-96px,0,0)';
       wrap.dataset.open='1';
     }else{
       row.style.transition='transform .18s ease';
       row.style.transform='translate3d(0,0,0)';
       wrap.dataset.open='0';
     }

     if(moved){
       // Prevent the synthetic click generated after a touch swipe.
       wrap.dataset.swiped='1';
       setTimeout(()=>{wrap.dataset.swiped='0'},350);
     }

     horizontal=false; moved=false; dx=0; pointerId=null;
     try{wrap.releasePointerCapture(e.pointerId)}catch(_){}
   };

   wrap.addEventListener('pointerdown',start,{passive:true});
   wrap.addEventListener('pointermove',move,{passive:false});
   wrap.addEventListener('pointerup',end,{passive:true});
   wrap.addEventListener('pointercancel',e=>{reset();try{wrap.releasePointerCapture(e.pointerId)}catch(_){}},{passive:true});

   // Swiping must never trigger the tile's inline add/remove action.
   wrap.addEventListener('click',e=>{
     if(wrap.dataset.swiped==='1'){
       e.preventDefault();
       e.stopPropagation();
       e.stopImmediatePropagation();
       wrap.dataset.swiped='0';
     }
   },true);

   trash.addEventListener('click',e=>{
     e.preventDefault();
     e.stopPropagation();
     e.stopImmediatePropagation();
     deleteLibraryTask(wrap.dataset.taskId);
   });
 });
}

function renderPeriodStats(){
 const out=document.getElementById("periodResult");if(!out)return;
 const from=document.getElementById("periodFrom")?.value||todayKey,to=document.getElementById("periodTo")?.value||from;
 if(from>to){out.innerHTML='<div class="period-summary period-empty">Дата «С» не может быть позже даты «По».</div>';return}
 // Future dates are not failures. For the main score, only dates before today are closed/assessable.
 const closedTo = [to, todayKey].sort()[0];
 const hasClosedDays = from < todayKey && from <= closedTo;
 const tasks=allTasks(), byId=new Map(tasks.map(t=>[t[0],t]));
 const entries=[];
 Object.keys(state.plans||{}).sort().forEach(date=>{
   if(date<from||date>=todayKey||date>to)return;
   (state.plans[date]||[]).forEach(p=>entries.push({date,...p,task:byId.get(p.id)}));
 });
 const planned=entries.length,done=entries.filter(x=>x.done).length,pct=planned?Math.round(done/planned*100):0;
 const cats={};
 const taskStats={};
 entries.forEach(e=>{
   const id=e.id;
   const raw=e.task;
   const t=Array.isArray(raw)?raw:[id,raw?.name||e.name||"Дело",raw?.emoji||"📝",raw?.category||raw?.cat||""];
   // Resolve category from the current library first. This prevents undefined
   // when older saved plans contain only an id/name and the library has the category.
   const libTask=byId.get(id);
   const cat=(Array.isArray(libTask)?libTask[3]:libTask?.category||libTask?.cat)||t[3]||"Без раздела";
   const name=(Array.isArray(libTask)?libTask[1]:libTask?.name)||t[1]||e.name||"Дело";
   const emoji=(Array.isArray(libTask)?libTask[2]:libTask?.emoji)||t[2]||"📝";
   if(!cats[cat])cats[cat]={cat,planned:0,done:0};
   cats[cat].planned++;
   if(e.done)cats[cat].done++;
   if(!taskStats[id])taskStats[id]={id,name,emoji,cat,planned:0,done:0,rows:[]};
   taskStats[id].planned++;
   if(e.done){taskStats[id].done++;taskStats[id].rows.push(e)}
 });
 const catRows=Object.values(cats).sort((a,b)=>b.planned-a.planned);
 const taskRows=Object.values(taskStats).sort((a,b)=>{const ap=a.planned?a.done/a.planned:0,bp=b.planned?b.done/b.planned:0;return ap-bp||b.planned-a.planned});
 // Composition of completed work: which sections make up the completed count.
 const completedByCat=Object.values(cats).filter(x=>x.done>0).sort((a,b)=>b.done-a.done);
 const compositionTotal=completedByCat.reduce((sum,x)=>sum+x.done,0);
 const compPalette=["#e78fa8","#8bb7a8","#9aa7d6","#e5b36f","#b39ac8","#78a9c4","#d39b87","#91aa79"];
 const compositionHtml=compositionTotal?`<div class="period-composition compact"><div class="period-composition-title">Состав выполненного</div><div class="period-composition-bar">${completedByCat.map((x,i)=>`<i style="width:${x.done/compositionTotal*100}%;background:${compPalette[i%compPalette.length]}" title="${escapeHtml(x.cat)}: ${x.done}"></i>`).join("")}</div><div class="period-composition-legend">${completedByCat.map((x,i)=>`<div class="period-composition-item"><i class="period-dot" style="background:${compPalette[i%compPalette.length]}"></i><span>${escapeHtml(x.cat)} <b>${x.done}</b></span></div>`).join("")}</div></div>`:`<div class="period-composition compact"><div class="period-composition-title">Состав выполненного</div><div class="period-composition-empty">Пока нет выполненных дел.</div></div>`;
 // A missed task is only a task whose scheduled date has already passed.
 const missed=taskRows.filter(x=>x.planned-x.done>0).sort((a,b)=>(b.planned-b.done)-(a.planned-a.done)).slice(0,5);
 // Day chart: last up to 14 closed days in the selected period, with weekday + date.
 const dayRows=[];let cursor=dateFrom(from),last=dateFrom(closedTo);
 if(from<todayKey){for(;cursor<=last;cursor.setDate(cursor.getDate()+1)){const ds=key(cursor),a=state.plans[ds]||[],d=a.filter(x=>x.done).length,p=a.length;dayRows.push({date:ds,p,d,pct:p?Math.round(d/p*100):0})}}
 const chartRows=dayRows.slice(-14);
 const maxPlan=Math.max(1,...chartRows.map(x=>x.p));
 const advice=[];
 if(!hasClosedDays){advice.push(to>=todayKey?"Пока ещё нет завершившихся дней в выбранном периоде. Будущие планы не считаются пропусками — статистика начнёт расти по мере прохождения дней.":"В выбранном периоде нет завершившихся дней с планом.");}
 else {
   if(pct<60) advice.push(`Выполнено ${pct}% плана по уже прошедшим дням. Посмотри на дела с наибольшим числом пропусков — возможно, их стоит перенести на более удобные дни или снизить частоту.`);
   else if(pct<80) advice.push(`Выполнено ${pct}% плана по прошедшим дням. Попробуй оставить в каждом дне несколько действительно важных дел, а остальное распределять свободнее.`);
   else advice.push(`Выполнено ${pct}% плана по прошедшим дням — ритм выглядит стабильным. Посмотри, какие отдельные дела заметно отстают, и скорректируй только их.`);
   const weak=taskRows.find(x=>x.planned>=3&&x.done/x.planned<.5);
   if(weak) advice.push(`«${escapeHtml(weak.name)}» выполнено ${weak.done} из ${weak.planned} раз. Возможно, стоит уменьшить частоту или привязать это дело к конкретному дню.`);
   const strong=taskRows.find(x=>x.planned>=3&&x.done/x.planned>=.9);
   if(strong) advice.push(`«${escapeHtml(strong.name)}» — одно из самых стабильных дел: ${Math.round(strong.done/strong.planned*100)}%. Его частоту можно оставить как есть.`);
 }
 const catHtml=catRows.length?catRows.map(c=>{const cp=c.planned?Math.round(c.done/c.planned*100):0;return `<div class="period-category"><div class="period-cat-head"><div class="period-cat-name">${escapeHtml(c.cat)}</div><div class="period-cat-score">${cp}%</div></div><div class="period-cat-detail">${c.done} выполнено из ${c.planned} запланированных</div><div class="period-cat-bar"><i style="width:${cp}%"></i></div></div>`}).join(""):"<div class=\"period-summary period-empty\">В выбранном периоде пока нет завершившихся дней.</div>";
 const taskHtml=taskRows.length?taskRows.map(t=>{const tp=t.planned?Math.round(t.done/t.planned*100):0;return `<div class="period-task-row"><div class="period-task-head"><span class="period-task-icon">${escapeHtml(t.emoji)}</span><span class="period-task-name">${escapeHtml(t.name)}</span><span class="period-task-score">${t.done}/${t.planned}</span></div><div class="period-task-detail">${escapeHtml(t.cat)} · ${tp}% выполнения</div><div class="period-task-bar"><i style="width:${tp}%"></i></div></div>`}).join(""):"<div class='period-summary period-empty'>За прошедшие дни пока нет данных.</div>";
 const missedHtml=missed.length?missed.map(t=>`<div class="period-missed-row"><span>${escapeHtml(t.emoji)} ${escapeHtml(t.name)}</span><strong>${t.planned-t.done} ${t.planned-t.done===1?"пропуск":"пропуска"}</strong></div>`).join(""):"<div class='period-good'>За прошедшие дни нет повторяющихся пропусков. Будущие дела здесь не учитываются. 🎉</div>";
 const chart=chartRows.length?`<div class="period-chart"><div class="period-chart-grid"><div class="period-chart-y"><span>100%</span><span>50%</span><span>0%</span></div><div class="period-chart-bars">${chartRows.map(x=>`<div class="period-chart-col"><div class="period-chart-stack" title="${x.d} из ${x.p} выполнено"><i class="planned-bar" style="height:${Math.max(4,(x.p/maxPlan)*100)}%"></i><i class="done-bar" style="height:${Math.max(3,(x.d/maxPlan)*100)}%"></i></div><div class="period-chart-label"><b>${dateFrom(x.date).getDate()}</b><span>${dateFrom(x.date).toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}</span></div></div>`).join("")}</div></div><div class="period-chart-legend"><span><i class="legend-planned"></i> запланировано</span><span><i class="legend-done"></i> выполнено</span></div></div>`:`<div class="period-summary period-empty">Диаграмма появится после первого завершившегося дня.</div>`;
 const adviceHtml=advice.map((a,i)=>`<div class="period-advice"><div class="period-advice-title">${i===0?"💡 Что видно по данным":"Ещё наблюдение"}</div><div class="period-advice-text">${a}</div></div>`).join("");
 out.innerHTML=`<div class="period-summary"><div class="period-muted">Выполнение по прошедшим дням</div><div class="period-big">${hasClosedDays?pct+"%":"—"}</div><div class="period-muted">${hasClosedDays?`${done} из ${planned} дел выполнено`:"Пока нечего сравнивать"}</div>${compositionHtml}</div><div class="period-section"><h3>Статистика выполнения</h3>${chart}</div><div class="period-section"><h3>📝 По делам</h3>${taskHtml}</div><div class="period-section"><h3>🔎 Что чаще пропускалось</h3><div class="period-summary">${missedHtml}</div></div><div class="period-section"><h3>💡 Подсказки</h3>${adviceHtml}</div>`;
}

const palette=["#e98d9d","#eaa77a","#e4c56f","#a5bb80","#71b7a3","#74a9c6","#8f9ed0","#aa91c8","#c98cab","#8e6f83","#6f8792","#d38f76"];
document.getElementById("modal").innerHTML=`<div class="sheet"><button class="close" onclick="closeM()">×</button><h3>Настройки</h3>

<p>Фон карточки</p><div class="opts">

<button class="opt color-card ${state.bg==="color"?"selected":""}" onclick="setBg('color')"><div class="color-preview" style="background:${state.solidColor}"><span>Любой цвет</span></div>Однотонный фон</button>

function getHueFromHex(hex){return hexToHsv(hex).h}
function hexToHsv(hex){
hex=hex.replace("#","");let r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
let max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);if(h<0)h+=360}return {h,s:max?d/max:0,v:max}}
function hsvToHex(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return "#"+[r,g,b].map(q=>Math.round((q+m)*255).toString(16).padStart(2,"0")).join("")}
function positionHue(h){const hk=document.getElementById("hueKnob");if(hk)hk.style.left=`${h/360*100}%`}
function updateSettingsUI(){
const modal=document.getElementById("modal");if(!modal)return;
modal.querySelectorAll(".opts .opt").forEach(b=>b.classList.remove("selected"));
modal.querySelectorAll(".opts .opt").forEach(b=>{const a=b.getAttribute("onclick")||"";if((state.accent==="green"&&a.includes("setAccent('green'"))||(state.accent==="pink"&&a.includes("setAccent('pink'"))||(state.theme==="day"&&a.includes("setTheme('day'"))||(state.theme==="night"&&a.includes("setTheme('night'"))||(state.bg!=="color"&&a.includes(`setBg('${state.bg}'`))||(state.bg==="color"&&a.includes("setBg('color'")))b.classList.add("selected")});
const prev=modal.querySelector(".color-preview");if(prev)prev.style.background=state.solidColor;
modal.querySelectorAll(".color-swatch").forEach(b=>b.classList.toggle("selected",b.style.backgroundColor===state.solidColor||b.style.background===state.solidColor));
positionHue(getHueFromHex(state.solidColor||"#d9d3d6"));
}
function setSolidColor(c){state.solidColor=c;state.bg="color";save();applyAppearance();updateSettingsUI()}
function attachHuePicker(){
const hu=document.getElementById("huePicker");if(!hu)return;let down=false;
function point(e){const r=hu.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
function apply(x){
const h=x*360;const c=hsvToHex(h,.42,.91);state.solidColor=c;state.bg="color";save();
const hk=document.getElementById("hueKnob");if(hk)hk.style.left=`${x*100}%`;
const prev=document.querySelector(".color-preview");if(prev)prev.style.background=c;
const progress=document.querySelector(".progress");if(progress){progress.style.backgroundImage="none";progress.style.backgroundColor=c}
}
hu.addEventListener("pointerdown",e=>{down=true;hu.setPointerCapture(e.pointerId);apply(point(e))});
hu.addEventListener("pointermove",e=>{if(down)apply(point(e))});
hu.addEventListener("pointerup",()=>{down=false;updateSettingsUI()});
hu.addEventListener("pointercancel",()=>{down=false;updateSettingsUI()});
}
function setAccent(x){state.accent=x;save();applyAppearance();updateSettingsUI();syncSelectedTiles()}
function setTheme(x){state.theme=x;save();applyAppearance();updateSettingsUI()}
function setBg(x){state.bg=x;save();applyAppearance();updateSettingsUI()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)persistData()});
window.addEventListener("pagehide",()=>persistData());
window.addEventListener("beforeunload",()=>persistData());

(function(){
 const oldRender=window.render; if(typeof oldRender==="function"){ window.render=function(){ const r=oldRender.apply(this,arguments); setTimeout(updateGlobalNav,0); return r; }; }
 const oldMonth=window.month; if(typeof oldMonth==="function"){ window.month=function(){ const r=oldMonth.apply(this,arguments); setTimeout(updateGlobalNav,0); return r; }; }

 const oldStats=window.openPeriodStats; if(typeof oldStats==="function"){ window.openPeriodStats=function(){ const r=oldStats.apply(this,arguments); setTimeout(updateGlobalNav,0); return r; }; }
})();

persistData();
applyAppearance();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=51");
</script>
